name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CSweetAgentSdk.slnx --configuration Release
      - run: dotnet pack src/CSweet.Agent.SDK/CSweet.Agent.SDK.csproj --configuration Release --no-build --output artifacts
      - run: dotnet test CSweetAgentSdk.slnx --configuration Release --no-build
      - shell: pwsh
        run: ./scripts/verify-authoring-template.ps1
